[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roborsi"
version = "0.0.0"
authors = [{ name = "RoboRSI Contributors" }]
description = "SenseNova-RoboRSI — Embodied agents and benchmark evaluation"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.44.0",
    "pydantic>=2",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "numpy",
    "imageio>=2.0",
    "PyYAML>=6.0",
    "packaging>=23",
]

[project.scripts]
bench = "roborsi.evaluation.cli:main"
roborsi-bench = "roborsi.evaluation.cli:main"
roborsi-trajectory = "roborsi.cli.trajectory:main"
roborsi-icl = "roborsi.cli.icl:main"

[project.urls]
Homepage = "https://github.com/OpenSenseNova/SenseNova-RoboRSI"
Repository = "https://github.com/OpenSenseNova/SenseNova-RoboRSI"
Documentation = "https://github.com/OpenSenseNova/SenseNova-RoboRSI/tree/main/docs"
"Bug Report" = "https://github.com/OpenSenseNova/SenseNova-RoboRSI/issues"

[project.optional-dependencies]
runtime = [
    "pydantic-ai-harness>=0.34,<0.35",
]
test = [
    "roborsi[runtime]",
    "coverage",
    "pytest",
    "pytest-timeout",
    "omegaconf",
    "scipy>=1.14",
    "build",
    "setuptools>=68",
    "wheel",
]
[tool.uv]
prerelease = "allow"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["roborsi*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*", "work*", "build*"]

[tool.setuptools.package-data]
"roborsi.schemas" = ["*.json"]
"roborsi.dashboard" = ["static/trajectory.js", "static/trajectory.css"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["roborsi"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
