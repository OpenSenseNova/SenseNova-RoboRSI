schema_version: 1
source_root: ../../../..
factory: robots.dexjoco.agents.baseline.factory:make_agent
code:
- factory.py
- policy.py
- session.py
- ../../reference.py
- ../../contracts.py
prompt_file: prompts/policy.md
skills: []
resources:
  reference: resources/reference-code.zip
  reference_license: resources/LICENSE.reference
  initial_prompt: prompts/initial.md
  continuation_prompt: prompts/continuation.md
agent:
  planner: codex_cli
  model: gpt-6-astra
  reasoning_effort: max
  max_turns: null
  max_tokens: null
  planner_timeout_s: 0
  action_timeout_s: null
  codex_cli:
    executable: codex
    expected_version: codex-cli 0.154.0
    tools: external
    inherit_env: false
    cli_args:
    - --ignore-user-config
    - --ignore-rules
    - --skip-git-repo-check
    - --sandbox
    - workspace-write
    - --disable
    - multi_agent
    - --disable
    - multi_agent_v2
    - --disable
    - apps
    - --disable
    - plugins
    - --disable
    - remote_plugin
    - --disable
    - hooks
    - --disable
    - memories
    - --disable
    - external_agent_memory_import
    - --disable
    - browser_use
    - --disable
    - browser_use_external
    - --disable
    - computer_use
    - --disable
    - in_app_browser
    - --disable
    - image_generation
    - --disable
    - guardian_approval
    - --disable
    - guardian_ext
    - --disable
    - guardianv2
    - --disable
    - workspace_dependencies
    - --disable
    - skill_search
    - --disable
    - skill_mcp_dependency_install
    - --disable
    - shell_snapshot
    - --disable
    - goals
    config_overrides:
      approval_policy: never
      web_search: disabled
      sandbox_workspace_write.network_access: false
      allow_login_shell: false
      project_doc_max_bytes: 0
dependencies:
- numpy==1.26.4
- scipy==1.15.3
- Pillow==11.3.0
- PyYAML==6.0.2
