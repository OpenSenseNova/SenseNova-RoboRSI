agent:
  planner: codex_cli
  model: ""  # Required at runtime: ROBORSI_CODEX_MODEL
  reasoning_effort: xhigh
  max_turns: null
  max_tokens: null
  planner_timeout_s: 0
  action_timeout_s: null
  codex_cli:
    executable: runtime/codex/bin/codex
    expected_version: codex-cli 0.160.1
    expected_sha256: f34a4d2301892ae96c90097786bfe5dc269f187b6f69faf42a7b357b8c081e35
    tools: external
    inherit_env: false
    env_vars:
      - CODEX_API_KEY
    cli_args: []
    config_overrides:
      approval_policy: never
      model_auto_compact_token_limit: 200000
      model_context_window: 200000
      web_search: disabled
      features.multi_agent: false
      model_provider: runtime
      model_providers.runtime.name: Runtime
      model_providers.runtime.base_url: ""  # Required: ROBORSI_CODEX_BASE_URL
      model_providers.runtime.wire_api: responses
      model_providers.runtime.env_key: CODEX_API_KEY
      model_providers.runtime.stream_max_retries: 8
      model_providers.runtime.request_max_retries: 8
